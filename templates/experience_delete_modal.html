<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-experience-{{ experience.id }}"
            aria-label="Delete {{ experience.title }}"
            title="Delete experience">
        Delete experience
    </button>
</p>
<div id="delete-experience-{{ experience.id }}"
     class="experience-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-{{ experience.id }}">
    <button type="button"
            class="experience-delete-modal__backdrop"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus">x</button>
    <div class="experience-delete-modal__content">
        <button type="button"
                class="experience-delete-modal__close"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus"></button>
        <h2 id="delete-experience-{{ experience.id }}">Delete experience?</h2>
        <p>
            Are you sure you want to remove your experience:
            <strong>{{ experience.title }}</strong>?
        </p>

        <form method="post" action="{% url 'main:delete_experience' experience.id %}">
            {% csrf_token %}    
            <div class="form-group">
                <input type="password"
                       name="passcode"
                       placeholder="Enter admin passcode"
                       required>
            </div>
            <div class="experience-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-experience-{{ experience.id }}"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button button-danger">Yes, I'm sure</button>
            </div>
        </form>
        
    </div>
</div>
