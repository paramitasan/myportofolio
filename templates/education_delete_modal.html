<p class="experience-status">
    <button type="button"
            class="button button-danger"
            popovertarget="delete-education-{{ education.id }}"
            aria-label="Delete {{ education.institution_name }} record"
            title="Delete education">
        Delete record
    </button>
</p>
<div id="delete-education-{{ education.id }}"
     class="education-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-education-institution-{{ education.id }}">
    <button type="button"
            class="education-delete-modal__backdrop"
            popovertarget="delete-education-{{ education.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus">x</button>
    <div class="education-delete-modal__content">
        <button type="button"
                class="education-delete-modal__close"
                popovertarget="delete-education-{{ education.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus"></button>
        <h2 id="delete-education-institution-{{ education.id }}">Delete education record?</h2>
        <p>
            Are you sure you want to remove your education record at
            <strong>{{ education.institution_name }}</strong>?
        </p>

        <form method="post" action="{% url 'main:delete_education' education.id %}">
            {% csrf_token %}    
            <div class="form-group">
                <input type="password"
                       name="passcode"
                       placeholder="Enter admin passcode"
                       required>
            </div>
            <div class="education-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="delete-education-{{ education.id }}"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button button-danger">Yes, I'm sure</button>
            </div>
        </form>
        
    </div>
</div>
